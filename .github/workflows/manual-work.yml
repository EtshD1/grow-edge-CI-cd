name: Manual Workflow

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Env to deploy to"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Deploy
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: node scripts/deploy.js